; =====================================================================
;  Загружаем только то, что прототипу нужно (autoload = no).
;  Меньше модулей — быстрее старт, чище логи, меньше поверхность атаки.
;  При autoload = no зависимости тоже перечисляются явно.
;  chan_sip удалён в Asterisk 21+, работаем через PJSIP.
; =====================================================================
[modules]
autoload = no

; --- конфиги и CLI ---
load => pbx_config.so                       ; extensions.conf
load => res_clioriginate.so                 ; channel originate из CLI (make call-out)

; --- SIP (PJSIP) ---
load => res_pjproject.so
load => res_sorcery_config.so
load => res_sorcery_memory.so
load => res_sorcery_astdb.so
load => res_pjsip.so
load => chan_pjsip.so
load => res_pjsip_session.so
load => res_pjsip_sdp_rtp.so
load => res_pjsip_registrar.so              ; регистрация агентов
load => res_pjsip_authenticator_digest.so   ; проверка пароля агентов
load => res_pjsip_outbound_authenticator_digest.so ; ответ на 401 провайдера
load => res_pjsip_outbound_registration.so  ; на случай транка с регистрацией
load => res_pjsip_endpoint_identifier_ip.so ; провайдер по IP
load => res_pjsip_endpoint_identifier_user.so ; агенты по username
load => res_pjsip_nat.so                    ; force_rport / rewrite_contact
load => res_pjsip_caller_id.so
load => res_pjsip_rfc3326.so                ; Reason в BYE/CANCEL
load => res_pjsip_dtmf_info.so
load => res_pjsip_pubsub.so
load => res_pjsip_refer.so                  ; перевод вызова агентом
load => res_pjsip_logger.so                 ; pjsip set logger on

; --- медиа ---
load => res_rtp_asterisk.so
load => res_timing_timerfd.so
load => codec_ulaw.so
load => codec_alaw.so
load => codec_a_mu.so
load => format_wav.so                       ; подсказки IVR (custom/*.wav)
load => format_pcm.so                       ; штатные звуки и MOH в ulaw
load => format_gsm.so
load => codec_gsm.so
load => bridge_simple.so
load => bridge_native_rtp.so
load => bridge_holding.so

; --- приложения и функции диалплана ---
load => app_dial.so
load => app_queue.so
load => app_playback.so
load => app_echo.so
load => app_stack.so                        ; Gosub
load => func_callerid.so
load => func_cdr.so
load => func_channel.so

; --- MOH, CDR ---
load => res_musiconhold.so
load => cdr_csv.so
