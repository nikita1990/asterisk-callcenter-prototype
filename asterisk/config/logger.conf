[general]
dateformat = %F %T.%3q

[logfiles]
; console = то, что видно в `docker compose logs asterisk`
console  => notice,warning,error,verbose
messages => notice,warning,error,verbose

; queue_log (события очередей: ENTERQUEUE, CONNECT, ABANDON, ...) пишется
; по умолчанию в /var/log/asterisk/queue_log — смонтировано в ./logs
