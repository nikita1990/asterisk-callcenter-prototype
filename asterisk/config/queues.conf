; =====================================================================
;  Очереди: sales (продажи) и support (поддержка)
;  Участники статические; пауза/снятие с паузы — *46 / *47 из диалплана.
; =====================================================================

[general]
persistentmembers = yes
; агент в обеих очередях: wrapup/lastcall считаются общими
shared_lastcall = yes
log_membername_as_agent = yes

[queue-defaults](!)
musicclass = default
; сколько звонить агенту, пауза перед следующим кругом, отдых после разговора
timeout = 15
retry = 3
wrapuptime = 5
; не звонить агенту, который уже разговаривает (вместе с device_state_busy_at в pjsip)
ringinuse = no
; раздавать вызовы параллельно, если свободны несколько агентов
autofill = yes
; в очередь пускаем, только если есть хоть один доступный агент
joinempty = unavailable,invalid,unknown
leavewhenempty = unavailable,invalid,unknown
; объявления только своими (русскими) подсказками, без английских штатных
announce-position = no
announce-holdtime = no
periodic-announce = custom/queue-periodic
periodic-announce-frequency = 30
; переменные MEMBERINTERFACE/MEMBERNAME в канале агента — удобно для CDR
setinterfacevar = yes
setqueuevar = yes

[sales](queue-defaults)
; по кругу, начиная со следующего за последним ответившим
strategy = rrmemory
member => PJSIP/101,0,Agent 101,PJSIP/101
member => PJSIP/102,0,Agent 102,PJSIP/102

[support](queue-defaults)
; тот, кто дольше всех не разговаривал; 101 из продаж — резерв:
; с penalty 1 ему звонят, только когда 102 и 103 заняты или недоступны
strategy = leastrecent
member => PJSIP/102,0,Agent 102,PJSIP/102
member => PJSIP/103,0,Agent 103,PJSIP/103
member => PJSIP/101,1,Agent 101,PJSIP/101
